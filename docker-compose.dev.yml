# Development with hot reload inside Docker. Source is mounted, so saving a file reloads the browser (web)
# or restarts the API. Run: docker compose -f docker-compose.dev.yml up
# Then open http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabulation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-tabulation}
    ports:
      - "5432:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             npm ci &&
             npm run db:deploy -w apps/api &&
             npx -w apps/api prisma generate &&
             npm run seed -w apps/api &&
             npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tabulation}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-tabulation}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      USE_POLLING: "1"
      CHOKIDAR_USEPOLLING: "1"
    # Only the web port is published; Vite proxies /api to the API inside the same container.
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Linux node_modules live in volumes so they never mix with the host's Windows ones.
      - node-modules:/app/node_modules
      - api-node-modules:/app/apps/api/node_modules
      - web-node-modules:/app/apps/web/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-dev-data:
  node-modules:
  api-node-modules:
  web-node-modules:
