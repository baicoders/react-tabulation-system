<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" role="img" aria-label="Tally database: an event holds candidates, rounds and judges; judges' scores on criteria are the core data">
  <title>Tally database relationships</title>
  <style>
    .card { fill: #ffffff; stroke: #d7dadd; stroke-width: 1.25; }
    .core { fill: #e3eff2; stroke: #1b6c80; stroke-width: 2; }
    .name { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #131416; }
    .fields { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5f60; }
    .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5f60; }
    .link { fill: none; stroke: #8a9096; stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: draw 0.7s ease-in-out forwards; }
    .m2m { fill: none; stroke: #8a9096; stroke-width: 1.4; stroke-dasharray: 5 4; opacity: 0; animation: fade 0.6s ease-out forwards; }
    .flow { fill: none; stroke: #1b6c80; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 3 14; opacity: 0; animation: fade 0.4s ease-out 3.4s forwards, flow 1.1s linear 3.4s infinite; }
    .box { opacity: 0; animation: rise 0.5s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes draw { 0% { opacity: 1; stroke-dashoffset: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -17; } }
    @media (prefers-reduced-motion: reduce) {
      .box, .link, .m2m { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .flow { display: none; }
    }
  </style>
  <defs>
    <!-- Crow's foot: the many side of a relationship -->
    <marker id="many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 6H11M11 0L3 6L11 12" fill="none" stroke="#8a9096" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="590" rx="16" fill="#f9fbfc"/>

  <!-- relationships: one side first, many side last (crow's foot) -->
  <path class="link" pathLength="1" style="animation-delay:0.9s" d="M570 59H790" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.0s" d="M490 88V125H110V170" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.0s" d="M490 88V125H300V170" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.0s" d="M490 88V170" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.0s" d="M490 88V125H870V170" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.6s" d="M110 228V310" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.6s" d="M300 228V310" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.7s" d="M410 199H395V339H380" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.6s" d="M490 228V310" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.6s" d="M570 199H600" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.7s" d="M340 170V150H680V170" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.8s" d="M680 228V310" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:1.9s" d="M790 199H775V339H760" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:2.2s" d="M490 368V450" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:2.6s" d="M410 479H380" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:2.6s" d="M220 199H205V479H220" marker-end="url(#many)"/>
  <path class="link" pathLength="1" style="animation-delay:2.6s" d="M880 228V530H300V508" marker-end="url(#many)"/>
  <path class="m2m" style="animation-delay:2.0s" d="M850 228V420H540V368"/>
  <path class="m2m" style="animation-delay:2.0s" d="M170 310V250H250V228"/>

  <!-- scores flowing in from judges and criteria, after everything is drawn -->
  <path class="flow" d="M880 228V530H300V508"/>
  <path class="flow" d="M410 479H380"/>

  <text class="note" x="655" y="412">many to many: JudgeCategory</text>
  <text class="note" x="36" y="246">many to many:</text>
  <text class="note" x="36" y="261">CandidateGroupValue</text>

  <!-- tables -->
  <g class="box" style="animation-delay:0.5s"><rect class="card" x="30" y="30" width="160" height="58" rx="8"/><text class="name" x="44" y="54">AdminUser</text><text class="fields" x="44" y="74">username, password hash</text></g>
  <g class="box" style="animation-delay:0.1s"><rect class="core" x="410" y="30" width="160" height="58" rx="8"/><text class="name" x="424" y="54">Event</text><text class="fields" x="424" y="74">name, date, status, testing</text></g>
  <g class="box" style="animation-delay:0.6s"><rect class="card" x="790" y="30" width="160" height="58" rx="8"/><text class="name" x="804" y="54">AuditLog</text><text class="fields" x="804" y="74">actor, action, details</text></g>

  <g class="box" style="animation-delay:0.7s"><rect class="card" x="30" y="170" width="160" height="58" rx="8"/><text class="name" x="44" y="194">Group</text><text class="fields" x="44" y="214">name: House, Level</text></g>
  <g class="box" style="animation-delay:0.7s"><rect class="card" x="220" y="170" width="160" height="58" rx="8"/><text class="name" x="234" y="194">Candidate</text><text class="fields" x="234" y="214">number, name, photo</text></g>
  <g class="box" style="animation-delay:0.7s"><rect class="card" x="410" y="170" width="160" height="58" rx="8"/><text class="name" x="424" y="194">Round</text><text class="fields" x="424" y="214">order, kind, Top N, status</text></g>
  <g class="box" style="animation-delay:1.3s"><rect class="card" x="600" y="170" width="160" height="58" rx="8"/><text class="name" x="614" y="194">Pair</text><text class="fields" x="614" y="214">candidate A, candidate B</text></g>
  <g class="box" style="animation-delay:0.7s"><rect class="card" x="790" y="170" width="160" height="58" rx="8"/><text class="name" x="804" y="194">Judge</text><text class="fields" x="804" y="214">name, password hash</text></g>

  <g class="box" style="animation-delay:1.3s"><rect class="card" x="30" y="310" width="160" height="58" rx="8"/><text class="name" x="44" y="334">GroupValue</text><text class="fields" x="44" y="354">Red House, SHS</text></g>
  <g class="box" style="animation-delay:1.3s"><rect class="card" x="220" y="310" width="160" height="58" rx="8"/><text class="name" x="234" y="334">RoundEntry</text><text class="fields" x="234" y="354">advanced, score, rank</text></g>
  <g class="box" style="animation-delay:1.3s"><rect class="card" x="410" y="310" width="160" height="58" rx="8"/><text class="name" x="424" y="334">Category</text><text class="fields" x="424" y="354">name, weight</text></g>
  <g class="box" style="animation-delay:1.6s"><rect class="card" x="600" y="310" width="160" height="58" rx="8"/><text class="name" x="614" y="334">PairVote</text><text class="fields" x="614" y="354">winner, submitted</text></g>

  <g class="box" style="animation-delay:2.4s"><rect class="core" x="220" y="450" width="160" height="58" rx="8"/><text class="name" x="234" y="474">Score</text><text class="fields" x="234" y="494">points, draft or submitted</text></g>
  <g class="box" style="animation-delay:1.9s"><rect class="card" x="410" y="450" width="160" height="58" rx="8"/><text class="name" x="424" y="474">Criterion</text><text class="fields" x="424" y="494">name, min, max, weight</text></g>

  <text class="note" x="30" y="572">Solid line: one to many, the forked end is the many side. Dashed: many to many through a link table. Teal: the core data, an event and its scores.</text>
</svg>
