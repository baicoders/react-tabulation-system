server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Candidate pictures and import files can be large.
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The API sends long cache headers for pictures (file names change on every upload).
  location /uploads/ {
    proxy_pass http://api:3000;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Single page app: every other path serves index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
